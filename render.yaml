databases:
  - name: home-services-db
    plan: free
    databaseName: home_services
    user: home_services

services:
  - type: web
    name: home-services-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: API_BASE_PATH
        value: /api/v1
      - key: DATABASE_URL
        fromDatabase:
          name: home-services-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: CORS_ORIGIN
        value: '*'
      - key: LOG_LEVEL
        value: info
      # Set these in the Render dashboard rather than here (secrets):
      # RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET, FIREBASE_PROJECT_ID,
      # FIREBASE_CLIENT_EMAIL, FIREBASE_PRIVATE_KEY, GOOGLE_MAPS_API_KEY,
      # WHATSAPP_API_TOKEN, WHATSAPP_PHONE_NUMBER_ID, R2_ACCOUNT_ID,
      # R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET_NAME
